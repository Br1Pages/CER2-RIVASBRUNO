{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fundación Patrimonio Vivo</title>
  <link rel="stylesheet" href="{% static 'estilos.css' %}">
</head>
<body>
  <header>
    <a class="marca" href="{% url 'inicio' %}">
      <img src="{% static 'logo.svg' %}" alt="" width="34" height="34">
      Patrimonio Vivo
    </a>
    <nav>
      <a href="{% url 'catalogo' %}">Catálogo</a>
      {% if user.is_authenticated %}
        <a href="{% url 'gestion' %}">Gestión</a>
        {% if user.is_staff %}
          <a href="{% url 'admin:index' %}">Administración</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="enlace" type="submit">Cerrar sesión ({{ user.username }})</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Iniciar sesión</a>
      {% endif %}
    </nav>
  </header>

  {% block contenido %}{% endblock %}

  <footer>Fundación Patrimonio Vivo</footer>
</body>
</html>
